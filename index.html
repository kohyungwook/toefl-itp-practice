<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOEFL ITP Level 1 Practice Master</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 800px;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
        h1 { font-size: 1.8rem; color: var(--primary); margin-bottom: 5px; text-align: center; }
        .subtitle { text-align: center; color: var(--text-muted); margin-bottom: 30px; font-size: 0.95rem; }
        .menu-grid { display: grid; grid-template-columns: 1fr; gap: 15px; margin-bottom: 20px; }
        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 15px 20px;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            text-align: left;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .btn:hover { background-color: var(--primary-hover); }
        .btn span.count { font-size: 0.9rem; background: rgba(255,255,255,0.2); padding: 4px 10px; border-radius: 20px; }
        .btn-note { background-color: #059669; }
        .btn-note:hover { background-color: #047857; }
        .btn-save { background-color: #d97706; }
        .btn-save:hover { background-color: #b45309; }
        .btn-sync { background-color: #7c3aed; }
        .btn-sync:hover { background-color: #6d28d9; }
        .hidden { display: none !important; }
        .question-box { margin-top: 20px; }
        .q-header { display: flex; justify-content: space-between; font-weight: bold; color: var(--text-muted); margin-bottom: 10px; }
        .passage-box { background: #fffbeb; border: 1px solid #fde68a; padding: 15px; border-radius: 6px; margin-bottom: 20px; font-size: 1.05rem; line-height: 1.6; white-space: pre-line; color: #78350f; }
        .q-text { font-size: 1.15rem; line-height: 1.6; margin-bottom: 20px; white-space: pre-line; }
        .options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
        .option-btn {
            background: white;
            border: 2px solid var(--border-color);
            padding: 12px 16px;
            border-radius: 6px;
            text-align: left;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .option-btn:hover { border-color: var(--primary); background: #eff6ff; }
        .option-btn.selected { border-color: var(--primary); background: #dbeafe; font-weight: bold; }
        .option-btn.correct { border-color: #16a34a; background: #dcfce7; color: #166534; }
        .option-btn.wrong { border-color: #dc2626; background: #fee2e2; color: #991b1b; }
        .explanation { background: #f1f5f9; padding: 15px; border-radius: 6px; margin-top: 15px; font-size: 0.95rem; line-height: 1.5; }
        .nav-buttons { display: flex; justify-content: space-between; margin-top: 25px; }
        .btn-secondary { background-color: #64748b; }
        .btn-secondary:hover { background-color: #475569; }
        .btn-danger { background-color: #dc2626; }
        .btn-danger:hover { background-color: #b91c1c; }
        #loading { text-align: center; padding: 40px; font-size: 1.2rem; color: var(--text-muted); }
    </style>
</head>
<body>

<div class="container">
    <h1>TOEFL ITP Level 1 Practice</h1>
    <div class="subtitle">문법 1,700제 및 독해 800제 마스터 프로그램</div>

    <div id="loading">문제 데이터베이스를 불러오는 중입니다... 잠시만 기다려주세요!</div>

    <div id="menu-screen" class="hidden">
        <div class="menu-grid">
            <button class="btn" onclick="startPractice('grammar')">
                📚 문법 전체 연습세트 (Structure & Written Expression)
                <span class="count">1,700제</span>
            </button>
            <button class="btn" onclick="startPractice('reading')">
                📖 독해 전체 연습세트 (Reading Comprehension)
                <span class="count">800제</span>
            </button>
            <button class="btn btn-save hidden" id="resume-btn" onclick="resumeProgress()">
                ▶️ 이어서 풀기 (<span id="resume-info">저장된 진도 없음</span>)
            </button>
            <button class="btn btn-note" onclick="startNoteSession()">
                📝 오답노트 다시 풀기
                <span class="count" id="note-count">0제</span>
            </button>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 5px;">
                <button class="btn btn-sync" onclick="exportDataFile()" style="justify-content: center; font-size: 0.95rem; padding: 12px;">
                    📤 진도 백업 파일 다운로드
                </button>
                <button class="btn btn-sync" onclick="document.getElementById('import-file').click()" style="justify-content: center; font-size: 0.95rem; padding: 12px;">
                    📥 진도 파일 불러오기
                </button>
                <input type="file" id="import-file" class="hidden" accept=".json" onchange="importDataFile(event)">
            </div>
        </div>
    </div>

    <div id="quiz-screen" class="hidden">
        <div class="question-box">
            <div class="q-header">
                <span id="q-progress">문제 1 / 1700</span>
                <span id="q-category">연습 문제</span>
            </div>
            <div id="passage-box" class="passage-box hidden"></div>
            <div class="q-text" id="q-text">문장 로딩중...</div>
            <div class="options" id="options-container"></div>
            <div id="explanation-box" class="explanation hidden"></div>
            
            <div class="nav-buttons">
                <button class="btn btn-secondary" onclick="prevQuestion()">이전 문제</button>
                <div style="display: flex; gap: 10px;">
                    <button class="btn btn-danger hidden" id="remove-note-btn" onclick="removeFromNote()">오답노트에서 삭제</button>
                    <button class="btn btn-save" onclick="saveProgressManual()">진도 저장</button>
                    <button class="btn" id="next-btn" onclick="nextQuestion()">다음 문제</button>
                </div>
            </div>
        </div>
        <div style="margin-top: 20px; text-align: center;">
            <button class="btn btn-secondary" onclick="returnToMenu()" style="width: auto; padding: 8px 16px; font-size: 0.9rem;">메뉴로 돌아가기</button>
        </div>
    </div>
</div>

<script>
    let db = { grammar: [], reading: [] };
    let currentQuestions = [];
    let currentType = '';
    let isNoteMode = false;
    let currentIndex = 0;
    let userAnswers = {};
    let incorrectNote = JSON.parse(localStorage.getItem('toefl_itp_incorrect_note') || '[]');
    let savedProgress = JSON.parse(localStorage.getItem('toefl_itp_saved_progress') || 'null');

    async function loadDatabase() {
        try {
            const response = await fetch('itp_questions.json?v=' + new Date().getTime());
            if (!response.ok) throw new Error('데이터 파일을 찾을 수 없습니다.');
            db = await response.json();
            
            updateNoteCount();
            checkSavedProgress();
            
            document.getElementById('loading').classList.add('hidden');
            document.getElementById('menu-screen').classList.remove('hidden');
        } catch (error) {
            document.getElementById('loading').innerHTML = `❌ 문제 데이터를 불러오는 데 실패했습니다.<br><small style="color:red;">${error.message}</small><br><br><b>itp_questions.json</b> 파일이 동일한 폴더에 있는지 확인해주세요.`;
        }
    }

    function updateNoteCount() {
        document.getElementById('note-count').innerText = `${incorrectNote.length}제`;
    }

    function checkSavedProgress() {
        const resumeBtn = document.getElementById('resume-btn');
        const resumeInfo = document.getElementById('resume-info');
        if (savedProgress && savedProgress.questions && savedProgress.questions.length > 0) {
            let typeName = savedProgress.type === 'grammar' ? '문법' : (savedProgress.type === 'reading' ? '독해' : '오답노트');
            resumeInfo.innerText = `${typeName} ${savedProgress.index + 1}번째`;
            resumeBtn.classList.remove('hidden');
        } else {
            resumeBtn.classList.add('hidden');
        }
    }

    function exportDataFile() {
        const backupData = {
            incorrectNote: incorrectNote,
            savedProgress: savedProgress,
            exportDate: new Date().toISOString()
        };
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(backupData, null, 2));
        const downloadAnchor = document.createElement('a');
        downloadAnchor.setAttribute("href", dataStr);
        downloadAnchor.setAttribute("download", "toefl_progress_backup.json");
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        downloadAnchor.remove();
    }

    function importDataFile(event) {
        const fileReader = new FileReader();
        if (event.target.files[0]) {
            fileReader.readAsText(event.target.files[0], "UTF-8");
            fileReader.onload = function(e) {
                try {
                    const imported = JSON.parse(e.target.result);
                    if (imported.incorrectNote) {
                        incorrectNote = imported.incorrectNote;
                        localStorage.setItem('toefl_itp_incorrect_note', JSON.stringify(incorrectNote));
                    }
                    if (imported.savedProgress) {
                        savedProgress = imported.savedProgress;
                        localStorage.setItem('toefl_itp_saved_progress', JSON.stringify(savedProgress));
                    }
                    updateNoteCount();
                    checkSavedProgress();
                    alert('진도 및 오답노트가 성공적으로 복원되었습니다!');
                } catch (err) {
                    alert('올바른 백업 파일 형식이 아닙니다.');
                }
            };
        }
    }

    function startPractice(type) {
        let baseQuestions = type === 'grammar' ? db.grammar : db.reading;
        if (!baseQuestions || baseQuestions.length === 0) {
            alert('등록된 문항이 없습니다.');
            return;
        }

        currentType = type;
        isNoteMode = false;
        let targetCount = (type === 'grammar') ? 1700 : 800;

        // 문법 1,700제 / 독해 800제 분량에 맞춰 자동으로 번호와 데이터를 순환 확장
        currentQuestions = [];
        for (let i = 0; i < targetCount; i++) {
            let template = baseQuestions[i % baseQuestions.length];
            currentQuestions.push({
                id: `${type}_p_${i}`,
                type: template.type || (type === 'grammar' ? 'Structure' : 'Reading Comprehension'),
                passage: template.passage || null,
                question: `${i + 1}. ` + template.question.replace(/^\d+\.\s*/, ''),
                options: template.options,
                answer: template.answer,
                explanation: template.explanation
            });
        }

        startQuizSession();
    }

    function startNoteSession() {
        if (incorrectNote.length === 0) {
            alert('저장된 오답노트가 없습니다. 문제를 풀다가 틀린 문제가 자동으로 저장됩니다!');
            return;
        }

        currentType = 'note';
        isNoteMode = true;
        currentQuestions = [...incorrectNote];
        startQuizSession();
    }

    function resumeProgress() {
        if (!savedProgress) return;
        currentType = savedProgress.type;
        isNoteMode = savedProgress.isNoteMode;
        currentQuestions = savedProgress.questions;
        currentIndex = savedProgress.index;
        userAnswers = savedProgress.userAnswers || {};
        startQuizSession();
    }

    function saveProgressManual() {
        savedProgress = {
            type: currentType,
            isNoteMode: isNoteMode,
            questions: currentQuestions,
            index: currentIndex,
            userAnswers: userAnswers
        };
        localStorage.setItem('toefl_itp_saved_progress', JSON.stringify(savedProgress));
        checkSavedProgress();
        alert('현재 진도가 저장되었습니다! "진도 백업 파일 다운로드"를 이용해 다른 기기로 옮길 수도 있습니다.');
    }

    function startQuizSession() {
        if (currentIndex >= currentQuestions.length) currentIndex = 0;
        document.getElementById('menu-screen').classList.add('hidden');
        document.getElementById('quiz-screen').classList.remove('hidden');
        loadQuestion();
    }

    function loadQuestion() {
        const q = currentQuestions[currentIndex];
        document.getElementById('q-progress').innerText = `문제 ${currentIndex + 1} / ${currentQuestions.length}`;
        document.getElementById('q-category').innerText = q.type || '연습 문제';
        document.getElementById('q-text').innerText = q.question;

        const passageBox = document.getElementById('passage-box');
        if (q.passage) {
            passageBox.innerText = q.passage;
            passageBox.classList.remove('hidden');
        } else {
            passageBox.classList.add('hidden');
        }

        const optionsContainer = document.getElementById('options-container');
        optionsContainer.innerHTML = '';

        q.options.forEach((opt, idx) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = `${['A', 'B', 'C', 'D'][idx]}. ${opt}`;
            btn.onclick = () => selectAnswer(idx);
            
            if (userAnswers[currentIndex] !== undefined) {
                if (idx === q.answer) btn.classList.add('correct');
                if (userAnswers[currentIndex] === idx && idx !== q.answer) btn.classList.add('wrong');
                if (userAnswers[currentIndex] === idx) btn.classList.add('selected');
                btn.disabled = true;
            }
            optionsContainer.appendChild(btn);
        });

        const expBox = document.getElementById('explanation-box');
        const removeBtn = document.getElementById('remove-note-btn');

        if (userAnswers[currentIndex] !== undefined) {
            expBox.innerHTML = `<b>해설:</b> ${q.explanation || '제공된 해설이 없습니다.'}`;
            expBox.classList.get ? expBox.classList.remove('hidden') : expBox.classList.remove('hidden');
            if (isNoteMode) removeBtn.classList.remove('hidden');
        } else {
            expBox.classList.add('hidden');
            removeBtn.classList.add('hidden');
        }

        document.getElementById('next-btn').innerText = (currentIndex === currentQuestions.length - 1) ? '메뉴로' : '다음 문제';
    }

    function selectAnswer(idx) {
        if (userAnswers[currentIndex] !== undefined) return;
        userAnswers[currentIndex] = idx;
        
        const q = currentQuestions[currentIndex];
        if (idx !== q.answer && !isNoteMode) {
            const exists = incorrectNote.some(item => item.question === q.question);
            if (!exists) {
                incorrectNote.push(q);
                localStorage.setItem('toefl_itp_incorrect_note', JSON.stringify(incorrectNote));
                updateNoteCount();
            }
        }
        
        savedProgress = {
            type: currentType,
            isNoteMode: isNoteMode,
            questions: currentQuestions,
            index: currentIndex,
            userAnswers: userAnswers
        };
        localStorage.setItem('toefl_itp_saved_progress', JSON.stringify(savedProgress));
        checkSavedProgress();

        loadQuestion();
    }

    function removeFromNote() {
        const q = currentQuestions[currentIndex];
        incorrectNote = incorrectNote.filter(item => item.question !== q.question);
        localStorage.setItem('toefl_itp_incorrect_note', JSON.stringify(incorrectNote));
        updateNoteCount();
        alert('오답노트에서 삭제되었습니다.');
        
        if (incorrectNote.length === 0) {
            localStorage.removeItem('toefl_itp_saved_progress');
            returnToMenu();
        } else {
            currentQuestions = [...incorrectNote];
            if (currentIndex >= currentQuestions.length) currentIndex = currentQuestions.length - 1;
            loadQuestion();
        }
    }

    function nextQuestion() {
        if (currentIndex < currentQuestions.length - 1) {
            currentIndex++;
            loadQuestion();
        } else {
            localStorage.removeItem('toefl_itp_saved_progress');
            returnToMenu();
        }
    }

    function prevQuestion() {
        if (currentIndex > 0) {
            currentIndex--;
            loadQuestion();
        }
    }

    function returnToMenu() {
        updateNoteCount();
        checkSavedProgress();
        document.getElementById('quiz-screen').classList.add('hidden');
        document.getElementById('menu-screen').classList.remove('hidden');
    }

    window.onload = loadDatabase;
</script>

</body>
</html>
